name: Build and Publish Multi-Arch Docker Images

# Reusable workflow: builds CUDA 13 images for amd64 and arm64, then creates
# multi-arch manifests with caller-specified tags.

on:
  workflow_call:
    inputs:
      docker_target:
        description: "Dockerfile target stage (framework_final or runtime)"
        required: true
        type: string
      sgl_version:
        description: "Version string passed as SGL_VERSION build arg (empty to skip)"
        required: false
        type: string
        default: ""
      extra_build_args:
        description: "Additional --build-arg flags appended to docker buildx build"
        required: false
        type: string
        default: ""
      checkout_ref:
        description: "Git ref to checkout (empty for default)"
        required: false
        type: string
        default: ""
      tag_config:
        description: 'JSON array of {"cuda":"cu130","tags":["tag1","tag2"]}. Tags support {version} substitution.'
        required: true
        type: string
      use_environment:
        description: "GitHub environment name (e.g. prod) or empty for none"
        required: false
        type: string
        default: ""
      image_repo:
        description: "Docker Hub repo to push to (e.g. lmsysorg/sglang-staging for testing)"
        required: false
        type: string
        default: "lmsysorg/sglang"
      dependency_cache_key:
        description: "Refresh key for unpinned dependencies; empty uses the current UTC date"
        required: false
        type: string
        default: ""
      image_compression:
        description: "Layer compression: gzip (compatible default) or zstd for supporting runtimes"
        required: false
        type: string
        default: "gzip"

jobs:
  build-x86:
    if: github.repository == 'sgl-project/sglang'
    environment: ${{ inputs.use_environment || null }}
    runs-on: x64-docker-build-node
    env:
      TAG_CONFIG: ${{ inputs.tag_config }}
      SGL_VERSION: ${{ inputs.sgl_version }}
      IMAGE_REPO: ${{ inputs.image_repo }}
      DOCKER_TARGET: ${{ inputs.docker_target }}
      IMAGE_COMPRESSION: ${{ inputs.image_compression }}
      DEPENDENCY_CACHE_KEY: ${{ inputs.dependency_cache_key }}
    outputs:
      digest-cu130: ${{ steps.build-cu130.outputs.digest }}
    steps:
      - name: Delete huge unnecessary tools folder
        run: rm -rf /opt/hostedtoolcache

      - name: Cleanup workspace (remove root-owned files from prior runs)
        run: sudo rm -rf "$GITHUB_WORKSPACE"/* || true

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}

      - name: Compute Docker build metadata args
        run: |
          set -euo pipefail
          BUILD_COMMIT="$(git rev-parse HEAD)"
          BUILD_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          case "${IMAGE_COMPRESSION}" in
            gzip|zstd) ;;
            *) echo "Unsupported image compression: ${IMAGE_COMPRESSION}" >&2; exit 1 ;;
          esac
          case "${DOCKER_TARGET}" in
            framework_final|runtime) ;;
            *) echo "Unsupported Docker target: ${DOCKER_TARGET}" >&2; exit 1 ;;
          esac
          BUILDER_NAME="sglang-${RUNNER_NAME//[^a-zA-Z0-9_.-]/-}-cu130"
          echo "BUILDER_NAME=${BUILDER_NAME}" >> "$GITHUB_ENV"
          echo "DEPENDENCY_CACHE_EPOCH=${DEPENDENCY_CACHE_KEY:-$(date -u +%Y-%m-%d)}" >> "$GITHUB_ENV"
          python3 scripts/ci/utils/docker_build_metadata_args.py \
            --cuda cu130 \
            --tag-config "${TAG_CONFIG}" \
            --image-repo "${IMAGE_REPO}" \
            --sgl-version "${SGL_VERSION}" \
            --build-commit "${BUILD_COMMIT}" \
            --build-url "${BUILD_URL}" \
            > /tmp/docker-metadata-cu130.args

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          docker-images: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Set up persistent Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          name: ${{ env.BUILDER_NAME }}
          keep-state: true
          buildkitd-config: docker/buildkitd.toml

      - name: Bound old Docker cache usage
        run: |
          docker buildx prune --builder "${BUILDER_NAME}" --filter "until=72h" --keep-storage 150GB -f
          docker image prune -af --filter "until=72h"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push AMD64 image (CUDA 13)
        id: build-cu130
        run: |
          VERSION_ARG=""
          if [ -n "${SGL_VERSION}" ]; then
            VERSION_ARG="--build-arg SGL_VERSION=${SGL_VERSION}"
          fi
          mapfile -t METADATA_ARGS < /tmp/docker-metadata-cu130.args

          docker buildx build \
            --target "${DOCKER_TARGET}" \
            --platform linux/amd64 \
            --pull \
            --output "type=image,name=${IMAGE_REPO},push-by-digest=true,name-canonical=true,push=true,compression=${IMAGE_COMPRESSION},compression-level=6" \
            --cache-from "type=registry,ref=${IMAGE_REPO}:buildcache-cu130-amd64-framework_final" \
            --cache-from "type=registry,ref=${IMAGE_REPO}:buildcache-cu130-amd64-runtime" \
            --cache-to "type=registry,ref=${IMAGE_REPO}:buildcache-cu130-amd64-${DOCKER_TARGET},mode=max,compression=${IMAGE_COMPRESSION}" \
            -f docker/Dockerfile \
            --build-arg CUDA_VERSION=13.0.3 \
            --build-arg BUILD_TYPE=all \
            --build-arg INSTALL_FLASHINFER_JIT_CACHE=1 \
            --build-arg "DEPENDENCY_CACHE_EPOCH=${DEPENDENCY_CACHE_EPOCH}" \
            "${METADATA_ARGS[@]}" \
            ${VERSION_ARG} \
            ${{ inputs.extra_build_args }} \
            --metadata-file /tmp/metadata-cu130.json \
            .

          DIGEST=$(python3 -c "import json; print(json.load(open('/tmp/metadata-cu130.json'))['containerimage.digest'])")
          echo "Pushed digest: ${DIGEST}"
          echo "digest=${DIGEST}" >> $GITHUB_OUTPUT

  build-arm64:
    if: github.repository == 'sgl-project/sglang'
    environment: ${{ inputs.use_environment || null }}
    runs-on: arm-docker-build-node
    env:
      TAG_CONFIG: ${{ inputs.tag_config }}
      SGL_VERSION: ${{ inputs.sgl_version }}
      IMAGE_REPO: ${{ inputs.image_repo }}
      DOCKER_TARGET: ${{ inputs.docker_target }}
      IMAGE_COMPRESSION: ${{ inputs.image_compression }}
      DEPENDENCY_CACHE_KEY: ${{ inputs.dependency_cache_key }}
    outputs:
      digest-cu130: ${{ steps.build-cu130.outputs.digest }}
    steps:
      - name: Delete huge unnecessary tools folder
        run: rm -rf /opt/hostedtoolcache

      - name: Cleanup workspace (remove root-owned files from prior runs)
        run: sudo rm -rf "$GITHUB_WORKSPACE"/* || true

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}

      - name: Compute Docker build metadata args
        run: |
          set -euo pipefail
          BUILD_COMMIT="$(git rev-parse HEAD)"
          BUILD_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          case "${IMAGE_COMPRESSION}" in
            gzip|zstd) ;;
            *) echo "Unsupported image compression: ${IMAGE_COMPRESSION}" >&2; exit 1 ;;
          esac
          case "${DOCKER_TARGET}" in
            framework_final|runtime) ;;
            *) echo "Unsupported Docker target: ${DOCKER_TARGET}" >&2; exit 1 ;;
          esac
          BUILDER_NAME="sglang-${RUNNER_NAME//[^a-zA-Z0-9_.-]/-}-cu130"
          echo "BUILDER_NAME=${BUILDER_NAME}" >> "$GITHUB_ENV"
          echo "DEPENDENCY_CACHE_EPOCH=${DEPENDENCY_CACHE_KEY:-$(date -u +%Y-%m-%d)}" >> "$GITHUB_ENV"
          python3 scripts/ci/utils/docker_build_metadata_args.py \
            --cuda cu130 \
            --tag-config "${TAG_CONFIG}" \
            --image-repo "${IMAGE_REPO}" \
            --sgl-version "${SGL_VERSION}" \
            --build-commit "${BUILD_COMMIT}" \
            --build-url "${BUILD_URL}" \
            > /tmp/docker-metadata-cu130.args

      - name: Set up persistent Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          name: ${{ env.BUILDER_NAME }}
          keep-state: true
          buildkitd-config: docker/buildkitd.toml

      - name: Bound old Docker cache usage
        run: |
          docker buildx prune --builder "${BUILDER_NAME}" --filter "until=72h" --keep-storage 150GB -f
          docker image prune -af --filter "until=72h"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ARM64 image (CUDA 13)
        id: build-cu130
        run: |
          VERSION_ARG=""
          if [ -n "${SGL_VERSION}" ]; then
            VERSION_ARG="--build-arg SGL_VERSION=${SGL_VERSION}"
          fi
          mapfile -t METADATA_ARGS < /tmp/docker-metadata-cu130.args

          docker buildx build \
            --target "${DOCKER_TARGET}" \
            --platform linux/arm64 \
            --pull \
            --output "type=image,name=${IMAGE_REPO},push-by-digest=true,name-canonical=true,push=true,compression=${IMAGE_COMPRESSION},compression-level=6" \
            --cache-from "type=registry,ref=${IMAGE_REPO}:buildcache-cu130-arm64-framework_final" \
            --cache-from "type=registry,ref=${IMAGE_REPO}:buildcache-cu130-arm64-runtime" \
            --cache-to "type=registry,ref=${IMAGE_REPO}:buildcache-cu130-arm64-${DOCKER_TARGET},mode=max,compression=${IMAGE_COMPRESSION}" \
            -f docker/Dockerfile \
            --build-arg CUDA_VERSION=13.0.3 \
            --build-arg BUILD_TYPE=all \
            --build-arg INSTALL_FLASHINFER_JIT_CACHE=1 \
            --build-arg "DEPENDENCY_CACHE_EPOCH=${DEPENDENCY_CACHE_EPOCH}" \
            "${METADATA_ARGS[@]}" \
            ${VERSION_ARG} \
            ${{ inputs.extra_build_args }} \
            --metadata-file /tmp/metadata-cu130.json \
            .

          DIGEST=$(python3 -c "import json; print(json.load(open('/tmp/metadata-cu130.json'))['containerimage.digest'])")
          echo "Pushed digest: ${DIGEST}"
          echo "digest=${DIGEST}" >> $GITHUB_OUTPUT

  create-manifests:
    runs-on: ubuntu-latest
    needs: [build-x86, build-arm64]
    if: github.repository == 'sgl-project/sglang'
    environment: ${{ inputs.use_environment || null }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create multi-arch manifests
        env:
          TAG_CONFIG: ${{ inputs.tag_config }}
          SGL_VERSION: ${{ inputs.sgl_version }}
          IMAGE_REPO: ${{ inputs.image_repo }}
          X86_CU130: ${{ needs.build-x86.outputs.digest-cu130 }}
          ARM64_CU130: ${{ needs.build-arm64.outputs.digest-cu130 }}
          SHORT_SHA: ${{ github.sha }}
        run: |
          echo "${TAG_CONFIG}" | jq -c '.[]' | while read -r entry; do
            X86_DIGEST="${X86_CU130}"
            ARM64_DIGEST="${ARM64_CU130}"

            TAG_ARGS=""
            for tag in $(echo "${entry}" | jq -r '.tags[]'); do
              # Substitute template variables
              tag=$(echo "${tag}" | sed "s/{version}/${SGL_VERSION}/g")
              tag=$(echo "${tag}" | sed "s/{date}/$(date +%Y%m%d)/g")
              tag=$(echo "${tag}" | sed "s/{short_sha}/${SHORT_SHA:0:8}/g")
              TAG_ARGS="${TAG_ARGS} -t ${IMAGE_REPO}:${tag}"
            done

            docker buildx imagetools create \
              ${TAG_ARGS} \
              ${IMAGE_REPO}@${X86_DIGEST} \
              ${IMAGE_REPO}@${ARM64_DIGEST}

            echo "Published:${TAG_ARGS}"
          done
